name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @shapi/backend db:generate

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Backend lint
        run: pnpm --filter @shapi/backend lint

      - name: Build backend runtime graph
        run: |
          pnpm --filter @shapi/backend... build
          pnpm --filter @shapi/backend exec node -e "require('@shapi/github-integration')"

      - name: Unit tests (DB-free)
        run: |
          pnpm --filter @shapi/invariant-engine test
          pnpm --filter @shapi/drift-detection test
          pnpm --filter @shapi/sdk test
          pnpm --filter @shapi/diagnosis-engine test
          pnpm --filter @shapi/replay-engine test
          pnpm --filter @shapi/repair-generation test
          pnpm --filter @shapi/github-integration test
          pnpm --filter @shapi/demo-saas test
          pnpm --filter @shapi/backend exec vitest run

      - name: Build dashboard
        run: pnpm --filter @shapi/dashboard build

      - name: Build production dashboard
        run: |
          pnpm --dir dashboard install --frozen-lockfile --ignore-workspace
          pnpm --dir dashboard build

      - name: Prisma validate
        run: pnpm --filter @shapi/backend exec prisma validate
        env:
          DATABASE_URL: postgresql://shapi:shapi@localhost:5432/shapi?schema=public

  business-outcome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run business-outcome regression
        run: |
          pnpm --filter @shapi/demo-saas e2e
          pnpm --filter @shapi/demo-saas test -- src/index.test.ts
          pnpm --filter @shapi/repair-generation test -- src/business-outcome-proof.test.ts src/demo-saas-adapter.test.ts
