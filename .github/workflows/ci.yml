name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test secret-safe GitHub key encoder
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'shapi-test-private-key.pem'
          $output = Join-Path $env:RUNNER_TEMP 'shapi-test-private-key.b64'
          @"
          -----BEGIN PRIVATE KEY-----
          TEST-KEY-MATERIAL
          -----END PRIVATE KEY-----
          "@ | Set-Content -LiteralPath $fixture -Encoding utf8

          & pwsh -NoLogo -NoProfile -File ./scripts/encode-github-app-private-key.ps1 `
            -PemFile $fixture -OutputFile $output
          if ($LASTEXITCODE -ne 0) { throw 'The encoder failed for a valid synthetic PEM.' }

          $encoded = (Get-Content -LiteralPath $output -Raw).Trim()
          if ($encoded -notmatch '^[A-Za-z0-9+/]+=*$') {
            throw 'The encoder did not produce a single Base64 value.'
          }
          $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          $expected = (Get-Content -LiteralPath $fixture -Raw).Trim()
          if ($decoded -ne $expected) { throw 'The encoded PEM did not round-trip.' }

          $invalidRejected = $false
          try {
            & ./scripts/encode-github-app-private-key.ps1 -PemFile ./README.md -OutputFile $output
          } catch {
            if ($_.Exception.Message -notlike '*complete PEM private key*') { throw }
            $invalidRejected = $true
          }
          if (-not $invalidRejected) { throw 'The encoder accepted malformed PEM input.' }

      - name: Generate Prisma Client
        run: pnpm --filter @shapi/backend db:generate

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Backend lint
        run: pnpm --filter @shapi/backend lint

      - name: Build all workspaces
        run: |
          pnpm -r build
          pnpm --filter @shapi/backend exec node -e "require('@shapi/github-integration')"

      - name: Unit tests (all workspaces)
        run: pnpm -r test

      - name: Build dashboard
        run: pnpm --filter @shapi/dashboard build

      - name: Build production dashboard
        run: |
          pnpm --dir dashboard install --frozen-lockfile --ignore-workspace
          pnpm --dir dashboard build

      - name: Prisma validate
        run: pnpm --filter @shapi/backend exec prisma validate
        env:
          DATABASE_URL: postgresql://shapi:shapi@localhost:5432/shapi?schema=public

  business-outcome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run business-outcome regression
        run: |
          pnpm --filter @shapi/demo-saas e2e
          pnpm --filter @shapi/demo-saas test -- src/index.test.ts
          pnpm --filter @shapi/repair-generation test -- src/business-outcome-proof.test.ts src/demo-saas-adapter.test.ts

  outcome-checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shapi
          POSTGRES_PASSWORD: shapi
          POSTGRES_DB: shapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shapi -d shapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shapi:shapi@localhost:5432/shapi?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      OUTCOME_TEST_DATABASE_URL: postgresql://shapi:shapi@localhost:5432/shapi
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          pnpm --filter @shapi/backend db:generate
          pnpm build:packages
          pnpm --filter @shapi/backend db:migrate:deploy
          pnpm --filter @shapi/backend db:seed

      - name: Migrations match schema.prisma (no schema change without a migration)
        working-directory: apps/backend
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Outcome query runner against real Postgres (read-only, timeout)
        run: pnpm --filter @shapi/outcome-checks test

      - name: Outcome checks end to end (webhook -> query -> incident, reconcile)
        run: pnpm --filter @shapi/backend e2e:outcomes

      - name: Self-serve onboarding end to end (sign-up, session, Stripe connection, API key, sign-in)
        run: pnpm --filter @shapi/backend e2e:onboarding

      - name: Slack and email alerts end to end (outcome incident -> one alert per destination, resolved message)
        run: pnpm --filter @shapi/backend e2e:alerts

      - name: Encryption key setup and rotation end to end (stored secrets never stranded)
        run: pnpm --filter @shapi/backend e2e:key-rotation

      - name: Stripe change monitor end to end (API version upgrade, moved field, one incident and alert)
        run: pnpm --filter @shapi/backend e2e:stripe-changes

      - name: Forgot password end to end (no enumeration, one-time expiring links, sessions revoked)
        run: pnpm --filter @shapi/backend e2e:password-reset

      - name: Teammates end to end (invite links, roles enforced, revoke, removal signs out, isolation)
        run: pnpm --filter @shapi/backend e2e:team

      - name: "Delete workspace + retention end to end (Owner only, name typed, everything gone, others untouched, old data purged)"
        run: pnpm --filter @shapi/backend e2e:delete-workspace

      - name: "Webhook isolation (events reach the tenant whose secret signed them; production never skips signatures)"
        run: pnpm --filter @shapi/backend e2e:webhook-isolation

      - name: "Tenant isolation (every id-based route refuses another workspace)"
        run: pnpm --filter @shapi/backend e2e:tenant-isolation

      - name: "Route audit (every API route: auth required, no 5xx on bad input, no leaked internals)"
        run: pnpm --filter @shapi/backend e2e:route-audit

  benchmark:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shapi
          POSTGRES_PASSWORD: shapi
          POSTGRES_DB: shapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shapi -d shapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BENCH_DATABASE_URL: postgresql://shapi:shapi@localhost:5432/shapi
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir benchmark install --frozen-lockfile --ignore-workspace

      - name: Fetch pinned starter kits
        run: pnpm --dir benchmark fetch-kits

      - name: Detection benchmark (real kits, injected webhook bugs)
        run: |
          pnpm --dir benchmark bench
          cat benchmark/results/latest.md >> "$GITHUB_STEP_SUMMARY"
