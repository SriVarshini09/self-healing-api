name: hosted-infrastructure-smoke

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Public HTTPS API URL'
        required: true
        default: 'https://shapi-api.onrender.com'
        type: string
      dashboard_url:
        description: 'Public HTTPS dashboard URL'
        required: true
        default: 'https://shapi-dashboard.onrender.com'
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-infrastructure-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify public infrastructure without tenant credentials
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoLogo -NoProfile -File scripts/hosted-infrastructure-smoke.ps1 \
            -ApiUrl '${{ inputs.api_url }}' \
            -DashboardUrl '${{ inputs.dashboard_url }}'
