services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NODE_ENV: production
      HOST: 0.0.0.0
      DASHBOARD_URL: ${SHAPI_DASHBOARD_URL:-http://localhost:8080}
      SHAPI_BOOTSTRAP_TOKEN: ${SHAPI_BOOTSTRAP_TOKEN-}
      GITHUB_TOKEN: ${GITHUB_TOKEN-}
      GITHUB_ACCOUNT_LOGIN: ${GITHUB_ACCOUNT_LOGIN-}
      GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES-}
      GITHUB_APP_ID: ${GITHUB_APP_ID-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG-}
      GITHUB_WEBHOOK_SECRET_APP: ${GITHUB_WEBHOOK_SECRET_APP-}
      GITHUB_APP_INTEGRATION_ID: ${GITHUB_APP_INTEGRATION_ID-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET-}
      ALERT_WEBHOOK_TIMEOUT_MS: ${ALERT_WEBHOOK_TIMEOUT_MS-5000}
      ALERT_WEBHOOK_MAX_ATTEMPTS: ${ALERT_WEBHOOK_MAX_ATTEMPTS-3}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
      VITE_SHAPI_API_KEY: ${VITE_SHAPI_API_KEY-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
